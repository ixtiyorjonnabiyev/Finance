<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moliya - IFRS Financial Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="material-symbols-outlined logo-icon">account_balance</span>
      <h1 data-t="title">Moliya</h1>
    </div>
    <div class="header-controls">
      <select id="co" aria-label="company" class="md-select"></select>
      <button id="newco" class="md-btn md-btn-primary"><span class="material-symbols-outlined">add</span> <span data-t="newCompany"></span></button>
      <button id="editco" class="md-btn md-btn-outlined"><span class="material-symbols-outlined">edit</span> <span data-t="edit"></span></button>
      <button id="btn-ai" class="md-btn md-btn-ai"><span class="material-symbols-outlined">auto_awesome</span> <span data-t="aiAssistant">AI Assistant</span></button>
      <select id="lang" aria-label="language" class="md-select">
        <option value="uz">O'zbekcha</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <dialog id="dlg" class="md-dialog"></dialog>
  <dialog id="drill-dlg" class="md-dialog md-dialog-lg"></dialog>
  <dialog id="ai-dlg" class="md-dialog md-dialog-lg"></dialog>
  <main id="app" class="main-content"></main>

  <script src="/static/app.js"></script>
</body>
</html>
